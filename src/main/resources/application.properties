spring.application.name=personal-finance-manager

spring.datasource.url=jdbc:mysql://${DATABASE_ADDRESS:localhost}:${DATABASE_PORT:3306}/${DATABASE_SCHEMA:personal_finance_manager}?createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

spring.datasource.defaultSchema=personal_finance_manager.

logging.level.org.springframework.jdbc.core=TRACE